<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Atlas — Demo</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --accent: #4fd1c5;
    --text: #e6e8eb;
    --muted: #9aa4af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #171b21, var(--bg));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.06);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
  }
  p.subtitle {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(255,255,255,0.08);
  }
  video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 70vh;
    background: #000;
  }
  .fallback {
    padding: 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .footer {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .badge {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Motion Atlas — Demo</h1>
    <p class="subtitle">Client-side satellite flyover video generator from GPX/Strava files</p>

    <div class="video-wrap">
      <video controls preload="metadata">
        <source src="./demo.mp4" type="video/mp4">
        <p class="fallback">
          Your browser doesn't support embedded video.
          <a href="./demo.mp4">Download the demo</a> instead.
        </p>
      </video>
    </div>

    <div class="footer">
      <span class="badge">motion-atlas.vercel.app</span>
    </div>
  </div>
</body>
</html>
